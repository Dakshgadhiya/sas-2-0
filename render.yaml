services:
  - type: web
    name: sas-2-0-backend
    runtime: python
    pythonVersion: 3.11
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:10000 backend.app:app
    envVars:
      - key: APP_SECRET_KEY
        value: render-prod-secret-key-12345
      - key: JWT_SECRET
        value: render-prod-jwt-secret-67890
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: true
    disk:
      name: sas-data
      mountPath: /var/data
      sizeGB: 1
